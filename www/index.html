<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Street Food Rush</title>
<style>
  :root {
    --ink: #2b1840; --cream: #fff7e8; --red: #e8412f; --yellow: #ffc62e; --green: #3cc46a; --blue: #2f8ae8;
    --shadow: 0 5px 0 rgba(43, 24, 64, .35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1840; touch-action: none;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  .veil { background: rgba(43, 24, 64, .55); backdrop-filter: blur(3px); }
  button { font: inherit; border: 0; cursor: pointer; }
  .btn { background: var(--yellow); color: var(--ink); font-weight: 900; font-size: 22px; padding: 14px 34px; border-radius: 18px;
    box-shadow: var(--shadow); min-width: 200px; margin: 7px; letter-spacing: .5px; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(43,24,64,.35); }
  .btn.green { background: var(--green); color: #fff; } .btn.blue { background: var(--blue); color: #fff; }
  .btn.small { font-size: 17px; padding: 10px 20px; min-width: 0; }
  .card { background: var(--cream); border-radius: 26px; padding: 22px 20px; box-shadow: 0 8px 0 rgba(0,0,0,.25);
    width: min(360px, 100%); text-align: center; }
  h2 { margin: 0 0 12px; font-size: 28px; font-weight: 900; }

  /* Title */
  #title { justify-content: flex-end; padding-bottom: max(56px, env(safe-area-inset-bottom)); }
  .logo { position: absolute; top: max(40px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; }
  .logo h1 { margin: 0; font-size: clamp(44px, 14vw, 66px); line-height: .92; font-weight: 900; color: #fff; letter-spacing: 1px;
    text-shadow: 0 4px 0 var(--red), 0 8px 0 var(--ink), 0 12px 18px rgba(0,0,0,.35); transform: rotate(-4deg); }
  .logo h1 span { color: var(--yellow); }
  .logo p { color: #fff; font-weight: 800; margin: 18px 0 0; text-shadow: 0 2px 4px rgba(0,0,0,.5); font-size: 17px; }

  #title { background: linear-gradient(180deg, rgba(43,24,64,.15) 0%, rgba(43,24,64,0) 35%, rgba(43,24,64,.55) 100%); }
  .chef { width: min(62vw, 300px); margin-bottom: 4px; filter: drop-shadow(0 10px 12px rgba(0,0,0,.35)); animation: chefbob 2.4s ease-in-out infinite; }
  @keyframes chefbob { 50% { transform: translateY(-8px) rotate(1.5deg); } }

  /* Levels */
  .city { font-size: 15px; font-weight: 800; color: #8a6f9e; margin: -6px 0 12px; }
  #level-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  .level-card { background: var(--red); color: #fff; border-radius: 18px; aspect-ratio: 1; position: relative; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .level-card .num { font-size: 34px; font-weight: 900; }
  .level-card .lstars { color: var(--yellow); font-size: 16px; letter-spacing: 1px; } .lstars span { color: rgba(255,255,255,.35); }
  .level-card.locked { background: #b9a9c6; } .level-card .lock { position: absolute; font-size: 26px; }
  .coins-row { font-weight: 900; font-size: 18px; margin-bottom: 8px; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; padding: 0; display: block; }
  .topbar { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 8px; align-items: stretch; }
  .pill { background: var(--cream); border-radius: 16px; padding: 6px 12px; font-weight: 900; box-shadow: 0 4px 0 rgba(0,0,0,.25);
    display: flex; align-items: center; gap: 6px; font-size: 19px; }
  .pill.goal { flex: 1; flex-direction: column; align-items: stretch; gap: 3px; padding: 6px 10px; }
  .goal-top { display: flex; justify-content: space-between; font-size: 15px; }
  .goal-bar { height: 10px; background: #e2d3c2; border-radius: 6px; overflow: hidden; position: relative; }
  #goal-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--yellow), #ff9a1f); border-radius: 6px; transition: width .25s; }
  .goal-bar .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(43,24,64,.4); }
  #goal-stars { color: #d8c8b5; letter-spacing: 1px; } #goal-stars i { font-style: normal; } #goal-stars i.on { color: #ffb400; }
  #hud-time.low { color: var(--red); animation: pulse .5s infinite alternate; }
  #btn-pause { pointer-events: auto; width: 46px; font-size: 20px; justify-content: center; }
  @keyframes pulse { to { transform: scale(1.12); } }
  #hud-level { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 62px); left: 0; right: 0; text-align: center;
    color: #fff; font-weight: 900; text-shadow: 0 2px 3px rgba(0,0,0,.6); font-size: 14px; opacity: .9; }

  /* Bubbles above customers */
  #bubbles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .bubble { position: absolute; left: 0; top: 0; background: #fff; border-radius: 18px; padding: 6px 9px 7px; box-shadow: 0 4px 0 rgba(0,0,0,.2);
    will-change: transform; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -9px; margin-left: -9px; border: 9px solid transparent; border-bottom: 0; border-top-color: #fff; }
  .bubble.shake .order { animation: wiggle .3s infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .order { display: flex; gap: 6px; }
  .item { display: flex; flex-direction: column; align-items: center; min-width: 40px; }
  .item span { font-size: 30px; line-height: 1.05; }
  .item.got { opacity: .3; }
  .sauces { display: flex; gap: 3px; height: 9px; }
  .sauces i { width: 16px; height: 8px; border-radius: 4px; } .sauces i.k { background: #d8231b; } .sauces i.m { background: #f2c418; }
  .patience { height: 6px; background: #eee; border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .patience b { display: block; height: 100%; width: 100%; background: #4cd964; transition: width .2s linear; }
  .emote { font-size: 34px; }
  .float { position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 28px; color: #fff; pointer-events: none;
    text-shadow: 0 3px 0 var(--ink); animation: rise 1.1s ease-out forwards; white-space: nowrap; }
  .float.money { color: var(--yellow); } .float.perfect { color: #ff7ad1; font-size: 22px; } .float.combo { color: #7af0ff; font-size: 22px; }
  @keyframes rise { 0% { opacity: 0; margin-top: 10px; transform: translate(-50%,-50%) scale(.6); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
    100% { opacity: 0; margin-top: -70px; transform: translate(-50%,-50%) scale(1); } }

  /* Tutorial */
  #hint { position: fixed; left: 16px; right: 16px; bottom: max(22px, env(safe-area-inset-bottom)); background: var(--ink); color: #fff;
    font-weight: 800; font-size: 18px; text-align: center; padding: 12px 14px; border-radius: 16px; pointer-events: none; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  #arrow { position: fixed; left: 0; top: 0; font-size: 44px; pointer-events: none; filter: drop-shadow(0 3px 0 rgba(0,0,0,.4)); }
  #arrow span { display: block; animation: bob .6s infinite alternate ease-in-out; }
  @keyframes bob { to { transform: translateY(-14px); } }

  /* Results */
  #res-stars { font-size: 58px; color: #e2d3c2; margin: 4px 0 10px; }
  #res-stars i { font-style: normal; display: inline-block; } #res-stars i.on { color: #ffb400; animation: starpop .45s both; }
  @keyframes starpop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; font-weight: 800; font-size: 17px; text-align: start; margin: 0 auto 14px; max-width: 260px; }
  .stats b { text-align: end; }

  /* Settings */
  .row { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 18px; margin: 10px 0; }
  .toggle { width: 58px; height: 32px; border-radius: 16px; background: #cbbdd6; position: relative; }
  .toggle::after { content: ''; position: absolute; top: 4px; inset-inline-start: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: .2s; }
  .toggle.on { background: var(--green); } .toggle.on::after { inset-inline-start: 30px; }
  #set-lang { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0 14px; }
  #set-lang button { padding: 9px; border-radius: 12px; background: #eadff2; font-weight: 800; }
  #set-lang button.on { background: var(--blue); color: #fff; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="bubbles"></div>

<div id="title" class="screen">
  <div class="logo">
    <h1>STREET<br><span>FOOD</span><br>RUSH</h1>
  </div>
  <img class="chef" src="img/chef.png" alt="">
  <button class="btn green" id="btn-play" data-t="play">Play</button>
  <button class="btn small blue" id="btn-settings" data-t="settings">Settings</button>
</div>

<div id="levels" class="screen veil hidden">
  <div class="card">
    <h2>🗽 <span data-t="levels">New York</span></h2>
    <div class="coins-row">🪙 <span id="coins-total">0</span></div>
    <div id="level-list"></div>
    <button class="btn small" id="levels-back" data-t="back">Back</button>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="topbar">
    <div class="pill">🪙 <span id="hud-money">0</span></div>
    <div class="pill goal">
      <div class="goal-top"><span><span data-t="target">Goal</span> <span id="hud-goal">0</span></span><span id="goal-stars"><i>★</i><i>★</i><i>★</i></span></div>
      <div class="goal-bar"><div id="goal-fill"></div><div class="mark" style="left:62.5%"></div><div class="mark" style="left:81.2%"></div></div>
    </div>
    <div class="pill">⏱ <span id="hud-time">0:00</span></div>
    <button class="pill" id="btn-pause">❚❚</button>
  </div>
  <div id="hud-level"></div>
</div>

<div id="hint" class="hidden"></div>
<div id="arrow" class="hidden"><span>👇</span></div>

<div id="pause" class="screen veil hidden">
  <div class="card">
    <h2 data-t="paused">Paused</h2>
    <button class="btn green" id="pause-resume" data-t="resume">Resume</button>
    <button class="btn small" id="pause-quit" data-t="quit">Quit</button>
  </div>
</div>

<div id="results" class="screen veil hidden">
  <div class="card">
    <h2 id="res-title"></h2>
    <div id="res-stars"></div>
    <div class="stats">
      <span>🪙 <span data-t="earned">Earned</span></span><b id="res-money">0</b>
      <span>😋 <span data-t="served">Served</span></span><b id="res-served">0</b>
      <span>😠 <span data-t="lost">Left angry</span></span><b id="res-lost">0</b>
    </div>
    <button class="btn green" id="res-next" data-t="next">Next</button>
    <button class="btn" id="res-retry" data-t="retry">Retry</button>
    <button class="btn small blue" id="res-menu" data-t="menu">Menu</button>
  </div>
</div>

<div id="settings" class="screen veil hidden">
  <div class="card">
    <h2 data-t="settings">Settings</h2>
    <div class="row"><span data-t="sound">Sound</span><button class="toggle" id="set-sound"></button></div>
    <div class="row"><span data-t="music">Music</span><button class="toggle" id="set-music"></button></div>
    <div class="row"><span data-t="haptics">Vibration</span><button class="toggle" id="set-haptics"></button></div>
    <div class="row"><span data-t="language">Language</span></div>
    <div id="set-lang"></div>
    <button class="btn small" id="settings-back" data-t="back">Back</button>
  </div>
</div>

<script src="js/game.js"></script>
</body>
</html>
